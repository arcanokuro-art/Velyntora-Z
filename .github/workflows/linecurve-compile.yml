name: Velyntora LineCurve Compile Check

on:
  push:
    branches:
      - velyntora-linecurve-finish
  workflow_dispatch:

jobs:
  compile-linecurve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build extra-cmake-modules qt6-base-dev
      - name: Configure Krita
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=OFF
      - name: Compile modified LineCurve translation units
        run: |
          cmake --build build --target kritabasictools -- -k 0
