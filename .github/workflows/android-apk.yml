name: Velyntora Android APK

on:
  push:
    branches:
      - velyntora-android-apk
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KDECI_ANDROID_ABI: arm64-v8a
      KRITACI_ANDROID_PACKAGE_TYPE: debug
      KDECI_BUILD_TYPE: Release
      KDECI_WORKDIR_PATH: /tmp/wd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip ninja-build cmake git curl unzip zip openjdk-17-jdk

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;22.1.7171670"
          test -d "$SDK_ROOT/ndk/22.1.7171670"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/22.1.7171670" >> "$GITHUB_ENV"
          echo "KDECI_ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "KDECI_ANDROID_NDK_ROOT=$SDK_ROOT/ndk/22.1.7171670" >> "$GITHUB_ENV"

      - name: Prepare Krita Android build tooling
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r krita-deps-management/requirements.txt

      - name: Resolve Android dependency manifest
        run: |
          . venv/bin/activate
          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py krita-deps-management/latest/krita-deps.yml -p -o branch-corrected-deps.yml -d master
          python3 -u krita-deps-management/tools/generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml

      - name: Build Velyntora for Android arm64
        run: |
          . venv/bin/activate
          export CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/krita-deps-management/tools/android-toolchain-krita.cmake"
          export KDECI_REPO_METADATA_PATH="$GITHUB_WORKSPACE/krita-deps-management/repo-metadata"
          export KDECI_SKIP_ECM_ANDROID_TOOLCHAIN=True
          export KDECI_EXTRA_CMAKE_ARGS="-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF"
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py --project krita --branch velyntora-android-apk --platform Android/arm64-v8a/Qt5/Shared --only-build --skip-publishing 2>&1 | tee build-krita-android.log

      - name: Package debug APK
        shell: bash
        run: |
          set -euxo pipefail
          . venv/bin/activate
          export CI_COMMIT_SHORT_SHA="${GITHUB_SHA::8}"
          set +e
          python3 -u build-tools/ci-scripts/build-android-package.py --package-type debug 2>&1 | tee build-apk.log
          PACKAGE_SCRIPT_STATUS=${PIPESTATUS[0]}
          set -e
          echo "PACKAGE_SCRIPT_STATUS=$PACKAGE_SCRIPT_STATUS" | tee package-script-status.txt
          GRADLE_PROJECT="$KDECI_WORKDIR_PATH/krita/_build/krita_build_apk"
          echo "GRADLE_PROJECT=$GRADLE_PROJECT"
          if [ ! -d "$GRADLE_PROJECT" ]; then
            echo "::error::Generated Android Gradle project is missing: $GRADLE_PROJECT"
            find "$KDECI_WORKDIR_PATH/krita/_build" -maxdepth 4 -type d -print | tee "$GITHUB_WORKSPACE/android-build-directories.txt" || true
            exit 1
          fi
          find "$GRADLE_PROJECT" -maxdepth 3 -type f -print | tee "$GITHUB_WORKSPACE/gradle-project-files.txt" || true
          if ! find "$GRADLE_PROJECT" -type f -name "*.apk" -print -quit | grep -q .; then
            echo "create-apk produced no APK; invoking generated Gradle project explicitly"
            test -x "$GRADLE_PROJECT/gradlew"
            (
              cd "$GRADLE_PROJECT"
              ./gradlew --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-assemble-debug.log"
            )
          fi
          echo "=== create-apk output tree ==="
          find "$KDECI_WORKDIR_PATH/krita/_build/krita_build_apk" -maxdepth 8 -type f -print 2>/dev/null | tee create-apk-files.txt || true
          echo "=== Gradle APK output tree ==="
          find "$KDECI_WORKDIR_PATH/krita/_build/krita_build_apk/build/outputs" -maxdepth 8 -type f -print 2>/dev/null | tee gradle-output-files.txt || true
          if ! find "$KDECI_WORKDIR_PATH/krita" "$GITHUB_WORKSPACE" -type f -name "*.apk" -print -quit | grep -q .; then
            echo "::error::Krita create-apk target returned success but produced no APK."
            exit 1
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail
          : > apk-files.txt
          for root in "$KDECI_WORKDIR_PATH/krita" "$GITHUB_WORKSPACE"; do
            if [ -d "$root" ]; then
              find "$root" -type f \( -name "*.apk" -o -name "*.aab" \) -print | tee -a android-package-files.txt
              find "$root" -type f -name "*.apk" -print >> apk-files.txt
            fi
          done
          echo "=== Android package candidates ==="
          cat android-package-files.txt || true
          echo "=== Packaging/build output directories ==="
          find "$KDECI_WORKDIR_PATH/krita" -maxdepth 5 -type d \( -name "_packaging" -o -name "outputs" -o -name "apk" -o -name "krita_build_apk" \) -print | tee package-directories.txt || true
          test -s apk-files.txt

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Android-package-diagnostics
          path: |
            apk-files.txt
            android-package-files.txt
            package-directories.txt
            build-apk.log
            create-apk-files.txt
            gradle-output-files.txt
            gradle-assemble-debug.log
            gradle-project-files.txt
            android-build-directories.txt
            package-script-status.txt
          if-no-files-found: warn

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apk-output
          while IFS= read -r apk; do
            cp -v "$apk" apk-output/
          done < apk-files.txt
          test -n "$(find apk-output -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload Velyntora APK
        uses: actions/upload-artifact@v4
        with:
          name: Velyntora-Android-arm64-debug
          path: apk-output/*.apk
          if-no-files-found: error
